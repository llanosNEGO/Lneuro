<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<style>#neuro-map { height: 400px; width: 100%; }</style>
</head>
<body>
<div id="neuro-map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
    const map = L.map('neuro-map', {
       zoomControl: false,
       attributionControl: false
    }).setView([-16.4057863, -71.5318625], 16);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
    }).addTo(map);

    const customIcon = L.divIcon({
      className: 'bg-transparent border-none',
      html: `
        <div style="position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;margin-left:-20px;margin-top:-40px;">
          <svg style="width:40px;height:40px;color:#D48E5C;filter:drop-shadow(0 4px 3px rgb(0 0 0 / 0.07));" viewBox="0 0 24 24" fill="currentColor" stroke="none">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
          <div style="position:absolute;width:12px;height:12px;background:#FDE047;border-radius:50%;top:10px;"></div>
        </div>
      `,
      iconSize: [40, 40],
      iconAnchor: [0, 0] // the divIcon margin handles the anchor
    });

    L.marker([-16.4057863, -71.5318625], { icon: customIcon }).addTo(map);
</script>
</body>
</html>
